<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Zul Helmi Hilman Malik, S.H. Law Office - Konsultasi dan pendampingan hukum profesional.">

<title>Zul Helmi Hilman Malik, S.H. | Law Office</title>

<style>
:root {
  --gold: #d4af37;
  --dark: #090909;
  --card: #191919;
  --white: #f5f1e8;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--dark);
  color: var(--white);
  font-family: Georgia, "Times New Roman", serif;
  line-height: 1.8;
}

header {
  text-align: center;
  padding: 35px 15px;
  background: #050505;
  border-bottom: 2px solid var(--gold);
}

.logo {
  font-size: 65px;
  color: var(--gold);
}

header h1 {
  color: var(--gold);
  font-size: 29px;
  margin: 10px 0;
  letter-spacing: 1px;
}

header p {
  letter-spacing: 5px;
  font-size: 15px;
}

nav {
  background: #141414;
  text-align: center;
  padding: 15px 5px;
}

nav a {
  color: var(--gold);
  text-decoration: none;
  margin: 0 9px;
  font-size: 14px;
}

nav a:hover {
  color: white;
}

.hero {
  min-height: 480px;
  padding: 95px 20px;
  text-align: center;
  background:
    radial-gradient(circle at center, #393019, #090909 75%);
}

.hero h2 {
  font-size: 38px;
  color: var(--gold);
  line-height: 1.4;
}

.hero p {
  max-width: 700px;
  margin: 20px auto;
  font-size: 17px;
}

.gold-line {
  width: 100px;
  height: 2px;
  background: var(--gold);
  margin: 25px auto;
}

section {
  max-width: 1100px;
  margin: auto;
  padding: 65px 20px;
}

section h2 {
  text-align: center;
  color: var(--gold);
  font-size: 30px;
}

.card {
  background: var(--card);
  border: 1px solid #68552a;
  border-radius: 10px;
  padding: 30px;
  margin-top: 25px;
}

.card h3 {
  color: var(--gold);
  margin-top: 0;
}

.services {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
}

.services .card {
  margin-top: 0;
}

.button {
  display: inline-block;
  padding: 15px 30px;
  background: linear-gradient(135deg, #b88a27, #f1d477);
  color: #111;
  text-decoration: none;
  font-weight: bold;
  border-radius: 6px;
  margin-top: 20px;
  transition: 0.3s;
}

.button:hover {
  background: white;
}

.contact {
  text-align: center;
}

.contact strong {
  color: var(--gold);
}

footer {
  background: #030303;
  text-align: center;
  padding: 30px 15px;
  border-top: 1px solid var(--gold);
  color: #bbb;
  font-size: 13px;
}

.whatsapp {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #25d366;
  color: white;
  padding: 12px 18px;
  border-radius: 30px;
  text-decoration: none;
  font-family: Arial, sans-serif;
  font-size: 14px;
  font-weight: bold;
  box-shadow: 0 4px 15px #0008;
}

@media(max-width:600px) {
  header h1 {
    font-size: 23px;
  }

  .hero h2 {
    font-size: 29px;
  }

  nav a {
    font-size: 12px;
    margin: 0 5px;
  }

  section {
    padding: 45px 18px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">⚖️</div>
  <h1>ZUL HELMI HILMAN MALIK, S.H.</h1>
  <p>LAW OFFICE</p>
</header>

<nav>
  <a href="#beranda">Beranda</a>
  <a href="#profil">Profil</a>
  <a href="#layanan">Layanan</a>
  <a href="#kontak">Kontak</a>
</nav>

<div class="hero" id="beranda">
  <h2>
    Integritas, Profesionalisme<br>
    dan Dedikasi
  </h2>

  <div class="gold-line"></div>

  <p>
    Memberikan konsultasi dan pendampingan hukum
    dengan mengutamakan profesional
